databaseChangeLog:
  - changeSet:
      id: add-table-product-categories
      author: kisliashka100
      changes:
        - createTable:
            tableName: product_categories
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                  autoIncrement: true
              - column:
                  name: product_id
                  type: bigint
              - column:
                  name: name
                  type: NVARCHAR(100)