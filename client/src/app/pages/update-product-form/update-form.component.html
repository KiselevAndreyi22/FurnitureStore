<form (ngSubmit)="onSubmit()">
  <label>
    Название:
    <input [(ngModel)]="product.name" name="name" required>
  </label>
  <br>
  <label>
    Описание:
    <input [(ngModel)]="product.description" name="description" required>
  </label>
  <br>
  <label>
    Раздел:
    <input [(ngModel)]="product.category" name="category" required>
  </label>
  <br>
  <label>
    Цена:
    <input [(ngModel)]="product.price" name="price" type="number"
           step="0.01" required>
  </label>
  <br>
  <button type="submit">Обновить продукт</button>
</form>
