<div class="dashboard">
  <div class="dashboard__main">
    <section class="dashboard__section dashboard__section--user">
      <div class="user-card">
        <div class="user-card__info">
          <img [src]="user.avatarUrl" alt="Аватар" class="user-card__avatar" />
          <div class="user-card__text">
            <div class="user-card__name">{{ user.name }}</div>
            <div class="user-card__email">{{ user.email }}</div>
            <h1 (click)="logout()">Выйти</h1>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div class="own-products">
  <div class="create-product-wrapper">
    <a [routerLink]="['/create-product']">Создать продукт</a>
  </div>
  <h2>Мои объявления</h2>
  <div class="products-list">
    <div *ngFor="let product of products" class="product-card">
      <h3>{{ product.name }}</h3>
      <p>{{ product.description }}</p>
      <p><b>Цена:</b> {{ product.price }}</p>
      <button (click)="deleteProduct(product.id)">Удалить продукт</button>
    </div>
</div>
</div>
</div>
